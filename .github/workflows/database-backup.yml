# Half-hourly PostgreSQL backup (runs on GitHub — works even when your Mac is off).
#
# This is the permanent cloud backup path. Local Mac backups are also available
# via `npm run backup:install` (launchd → ~/.qems-backups), but GitHub Actions
# is required for true always-on protection.
#
# Setup (one time):
#   1. GitHub repo → Settings → Secrets and variables → Actions
#   2. Add secret: QURAN_EDUCATION_DATABASE_URL (same value as Vercel / .env)
#      (DATABASE_URL also works as a fallback name)
#   3. Ensure this workflow file is on the default branch
#
# Backups appear under Actions → "Database backup" → latest run → Artifacts.
# Each artifact is kept for 2 days (matches BACKUP_RETENTION_DAYS).

name: Database backup

on:
  schedule:
    # Every 30 minutes UTC (GitHub may delay a few minutes under load)
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # Make the workflow visible under Actions immediately after setup pushes
  push:
    paths:
      - ".github/workflows/database-backup.yml"

env:
  BACKUP_RETENTION_DAYS: "2"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg
          . /etc/os-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Run backup
        env:
          # GitHub Actions env keys are case-insensitive — define the URL once only.
          DATABASE_URL: ${{ secrets.QURAN_EDUCATION_DATABASE_URL || secrets.DATABASE_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backups
          BACKUP_LOG: ${{ runner.temp }}/backup.log
          BACKUP_RETENTION_DAYS: ${{ env.BACKUP_RETENTION_DAYS }}
          PATH: /usr/lib/postgresql/17/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "ERROR: Add QURAN_EDUCATION_DATABASE_URL (or DATABASE_URL) to GitHub Actions secrets."
            exit 1
          fi
          # Strip accidental wrapping quotes copied from .env files
          DATABASE_URL="${DATABASE_URL%\"}"
          DATABASE_URL="${DATABASE_URL#\"}"
          DATABASE_URL="${DATABASE_URL%\'}"
          DATABASE_URL="${DATABASE_URL#\'}"
          export DATABASE_URL
          echo "Using pg_dump: $(command -v pg_dump)"
          pg_dump --version
          bash scripts/backup-database.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: qems-db-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backups/*.dump
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}
          if-no-files-found: error

      - name: Print backup log
        if: always()
        run: cat "${{ runner.temp }}/backup.log" || true
